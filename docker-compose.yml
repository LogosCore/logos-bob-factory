# Local development: joins logos-core's network to reach core and its
# RabbitMQ.
# Start logos-core first, set RABBITMQ_PASSWORD in .env, then:
#
#   docker compose up -d --build
services:
  bob-factory:
    build:
      context: .
      args:
        VERSION: dev
    image: logos-bob-factory:dev
    container_name: logos-bob-factory
    restart: unless-stopped
    environment:
      FACTORY_ID: ${FACTORY_ID:-bob-local}
      # Core's address: builds fetch their files from it and upload the
      # artifact to it.
      LOGOS_CORE_BASE_URL: ${LOGOS_CORE_BASE_URL:-http://logos-core-dev:8002}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-logos-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-logos}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Where the minion's modules come from when the image lacks one: the
      # Go default (proxy.golang.org) unless set, a mirror where there is no
      # internet (with GOSUMDB=off or a proxied checksum database).
      GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
      GOSUMDB: ${GOSUMDB:-sum.golang.org}
    # Working on the minion: mount its sources over the image's, and the next
    # linux-elf build compiles your edits, without rebuilding BOB.
    # volumes:
    #   - ./minion:/app/minion:ro
    networks:
      - logos

networks:
  logos:
    external: true
    name: logos-core_logos
